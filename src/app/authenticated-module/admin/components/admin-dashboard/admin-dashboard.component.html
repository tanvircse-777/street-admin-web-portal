<nz-tabset nzCentered>
  <nz-tab [nzTitle]="'Date Range'" [nzDisabled]="false">
    <div class="row justify-content-center">
      <div class="col-6">
        <nz-range-picker
          [(ngModel)]="selectedDateRange"
          (ngModelChange)="onChangeDateRange($event)"
          nzFormat="dd-MM-yyyy"
        ></nz-range-picker>
      </div>
    </div>
    <div class="row justify-content-center">
      <div class="col-6">
        <div id="chart-line"></div>
      </div>
    </div>
  </nz-tab>

  <nz-tab [nzTitle]="'Month Wise'" [nzDisabled]="false"> tab 2 </nz-tab>
</nz-tabset>
