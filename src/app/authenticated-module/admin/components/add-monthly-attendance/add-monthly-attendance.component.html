<div [formGroup]="form">
  <h2>Select Month and Enter Data</h2>

  <!-- Month Dropdown -->
  <div>
    <label for="month">Select Month:</label>

    <nz-date-picker
      formControlName="selectedMonth"
      (ngModelChange)="onMonthChange($event)"
      [nzMode]="'month'"
      nzFormat="MMMM-yyyy"
    ></nz-date-picker>
  </div>

  <!-- Form Table -->
  <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="laodForm">
    <table>
      <thead>
        <tr>
          <th>Date</th>
          <th>Tanvir In Time</th>
          <th>Tanvir Out Time</th>
          <th>Shakil In Time</th>
          <th>Shakil Out Time</th>
          <th>Tarik In Time</th>
          <th>Tarik Out Time</th>
        </tr>
      </thead>
      <tbody formArrayName="daysData">
        <tr
          *ngFor="let day of daysData.controls; let i = index"
          [formGroupName]="i"
        >
          <td><input formControlName="date" readonly /></td>
          <td>
            <nz-time-picker
              formControlName="tanvirInTime"
              nzFormat="hh:mm a"
              nzUse12Hours
            ></nz-time-picker>
          </td>
          <td>
            <nz-time-picker
              formControlName="tanvirOutTime"
              nzFormat="hh:mm a"
              nzUse12Hours
            ></nz-time-picker>
          </td>

          <td>
            <nz-time-picker
              formControlName="shakilInTime"
              nzFormat="hh:mm a"
              nzUse12Hours
            ></nz-time-picker>
          </td>
          <td>
            <nz-time-picker
              formControlName="shakilOutTime"
              nzFormat="hh:mm a"
              nzUse12Hours
            ></nz-time-picker>
          </td>

          <td>
            <nz-time-picker
              formControlName="tarikInTime"
              nzFormat="hh:mm a"
              nzUse12Hours
            ></nz-time-picker>
          </td>
          <td>
            <nz-time-picker
              formControlName="tarikOutTime"
              nzFormat="hh:mm a"
              nzUse12Hours
            ></nz-time-picker>
          </td>
          <!-- Hidden field for database-formatted date -->
          <input formControlName="databaseDateFormat" type="hidden" />
        </tr>
      </tbody>
    </table>

    <button type="submit" [disabled]="!form.valid">Submit</button>
  </form>
</div>
